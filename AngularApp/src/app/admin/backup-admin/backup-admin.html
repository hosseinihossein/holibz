<mat-card>
    <mat-card-header>
        <mat-card-title>{{backupStatus()?.fileName}}</mat-card-title>
        <mat-card-subtitle>{{backupStatus()?.createdAt | date}}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
        <p>Ready to download: {{backupStatus()?.readyToDownload}}</p>
        <p>File Size: {{backupStatus()?.fileSize}}</p>
        <p>Status: {{backupStatus()?.overall_Status}}</p>
    </mat-card-content>
    <mat-card-actions align="end">
        @if(backupStatus()){
        <button matButton (click)="downloadFile()">Download</button>
        <button matButton (click)="deleteFile()">Delete</button>
        }
        @else {
        <button matButton (click)="generateFile()">Generate</button>
        }
    </mat-card-actions>
</mat-card>
