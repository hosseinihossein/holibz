@if(data.label){
<p mat-dialog-title>
    {{data.label}}({{data.totalNumberOfItems}})
</p>
}
<mat-dialog-content>
    <mat-form-field style="width: 100%;">
        <mat-label>Filter..</mat-label>
        <input matInput (input)="onUsernameFilter()">
    </mat-form-field>
    @for(user of users(); track user.guid){
    <div style="position: relative;">
        <span style="position: absolute;font-size: 12px;right: 0;">{{$index+1}}</span>
        <a [routerLink]="['/proile',user.guid]" mat-dialog-close>
            <div id="user-div">
                @if(singleton.getUserImageAddress(user)){
                <img [ngSrc]="singleton.getUserImageAddress(user)!" width="50" height="50" alt="user image">
                }
                @else {
                <mat-icon style="font-size: 50px;width: 50px;height: 50px;">account_circle</mat-icon>
                }
                <span>{{user.username}}</span>
            </div>
        </a>
    </div>
    }

    @if(displaySubmitSpinner()){
    <div id="submit-spinner-layout">
        <mat-spinner id="submit-spinner"></mat-spinner>
    </div>
    }

    <mat-dialog-actions>
        @if(users().length <= data.totalNumberOfItems){ <button matButton (click)="onMore()">
            More
            </button>
            }
            <button matButton mat-dialog-close>Ok</button>
    </mat-dialog-actions>
</mat-dialog-content>
