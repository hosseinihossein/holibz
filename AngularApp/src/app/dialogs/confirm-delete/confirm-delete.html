<h2 matDialogTitle>
    <mat-icon style="color: orangered;">warning</mat-icon>
    Warning
</h2>
<mat-dialog-content>
    <p>Are you sure you want to permanently <strong>Delete</strong> this document?</p>

        <button matButton mat-dialog-close>Cancel</button>
        <button matButton="filled" class="warning" mat-dialog-close="true">Yes</button>
    </mat-dialog-actions>
</mat-dialog-content>
