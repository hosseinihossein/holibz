<mat-dialog-content>
    <mat-form-field>
        <mat-label>Code</mat-label>
        <textarea matInput [value]="data.value" #codeInput placeholder="Write your paragraph here.."
            rows="5"></textarea>
    </mat-form-field>
    <mat-dialog-actions>
        <button matButton mat-dialog-close>Cancel</button>
        <button matButton="filled" [mat-dialog-close]="codeInput.value">Save</button>
    </mat-dialog-actions>
</mat-dialog-content>
