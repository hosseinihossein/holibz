<mat-dialog-content>

    @if(!data.enableEdit){
    <div id="file-box" class="clearfix">
        <span #fileName>{{selectedFile()?.name}}</span>
        <button matButton="elevated" id="selectButton" (click)="fileInput.click()">Select New File</button>
        <input type="file" hidden #fileInput (change)="onSelectFile($event)">
    </div>
    }

    <mat-form-field>
        <mat-label>Image Title</mat-label>
        <input matInput [value]="data.title" #titleInput>
    </mat-form-field>

    @if(data.enableEdit){
    <mat-dialog-actions align="end" style="float:inline-end;">
        <button matButton mat-dialog-close>Cancel</button>
        <button matButton="filled" [mat-dialog-close]="titleInput.value">Save</button>
    </mat-dialog-actions>
    <mat-dialog-actions align="start">
        <button matButton="filled" class="warning" mat-dialog-close="Delete">Delete</button>
    </mat-dialog-actions>
    }
    @else {
    <mat-dialog-actions align="end" style="float:inline-end;">
        <button matButton mat-dialog-close>Cancel</button>
        <button matButton="filled" [mat-dialog-close]="{file:selectedFile(),title:titleInput.value}">Save</button>
    </mat-dialog-actions>
    }

</mat-dialog-content>
