<mat-dialog-content>
    <mat-form-field>
        <mat-label>Header Text</mat-label>
        <input matInput [value]="data.value" #headerInput>
    </mat-form-field>
    <mat-dialog-actions>
        <button matButton mat-dialog-close>Cancel</button>
        <button matButton="filled" [mat-dialog-close]="headerInput.value">Save</button>
    </mat-dialog-actions>
    <mat-dialog-actions align="start">
        <button matButton="filled" class="warning" mat-dialog-close="Delete">Delete</button>
    </mat-dialog-actions>
</mat-dialog-content>
