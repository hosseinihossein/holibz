<mat-dialog-content>

    <div id="img-box" class="clearfix">
        <img [src]="previewImgSrc()" [alt]="data.title" #previewImg>
        @if(!data.enableEdit){
        <button matButton="elevated" id="selectButton" (click)="fileInput.click()">Select New Image</button>
        <input type="file" #fileInput (change)="onSelectImage($event)">
        }
    </div>

    <mat-form-field>
        <mat-label>Image Title</mat-label>
        <input matInput [value]="data.title" #titleInput>
    </mat-form-field>

    @if(data.enableEdit){
    <mat-dialog-actions align="end" style="float: right;">
        <button matButton mat-dialog-close>Cancel</button>
        <button matButton="filled" [mat-dialog-close]="titleInput.value">Save</button>
    </mat-dialog-actions>
    <mat-dialog-actions align="start">
        <button matButton="filled" class="warning" mat-dialog-close="Delete">Delete</button>
    </mat-dialog-actions>
    }
    @else {
    <mat-dialog-actions align="end" style="float: right;">
        <button matButton mat-dialog-close>Cancel</button>
        <button matButton="filled" [mat-dialog-close]="{file:selectedFile(),title:titleInput.value}">Save</button>
    </mat-dialog-actions>
    }

</mat-dialog-content>
