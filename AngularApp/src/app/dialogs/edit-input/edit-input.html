<mat-dialog-content>
    <mat-form-field>
        <mat-label>{{data.label}}</mat-label>
        <input matInput [value]="data.value" #myInput>
    </mat-form-field>
    <mat-dialog-actions>
        <button matButton mat-dialog-close>Cancel</button>
        <button matButton="filled" [mat-dialog-close]="myInput.value">Save</button>
    </mat-dialog-actions>
</mat-dialog-content>
