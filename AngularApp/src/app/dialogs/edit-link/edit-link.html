<mat-dialog-content>
    <mat-form-field>
        <mat-label>Link Title</mat-label>
        <input matInput type="text" [value]="data.title" #titleInput>
    </mat-form-field>
    <mat-form-field>
        <mat-label>LinkAddress</mat-label>
        <input matInput type="text" [value]="data.value" #linkInput>
    </mat-form-field>
    <mat-dialog-actions>
        <button matButton mat-dialog-close>Cancel</button>
        <button matButton="filled" [mat-dialog-close]="{title:titleInput.value, value:linkInput.value}">Save</button>
    </mat-dialog-actions>
</mat-dialog-content>
