<mat-dialog-content>
    <mat-form-field>
        <mat-label>Paragraph</mat-label>
        <textarea matInput [value]="data.value" #paragraphInput placeholder="Write your paragraph here.."
            rows="5"></textarea>
    </mat-form-field>
    <mat-dialog-actions>
        <button matButton mat-dialog-close>Cancel</button>
        <button matButton="filled" [mat-dialog-close]="paragraphInput.value">Save</button>
    </mat-dialog-actions>
    @if(data.enableDelete){
    <mat-dialog-actions align="start">
        <button matButton="filled" class="warning" mat-dialog-close="Delete">Delete</button>
    </mat-dialog-actions>
    }
</mat-dialog-content>
