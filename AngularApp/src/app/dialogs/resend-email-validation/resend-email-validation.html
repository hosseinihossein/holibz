<mat-dialog-content>
    <h1>Resending Email Validation Link</h1>
    <mat-form-field>
        <mat-label>Email</mat-label>
        <input matInput [value]="data.email" #emailInput>
    </mat-form-field>
    <mat-dialog-actions>
        <button matButton mat-dialog-close>Cancel</button>
        <button matButton="filled" (click)="resendEmailValidation(emailInput.value)"
            [disabled]="emailFormControl().invalid">Resend</button>
    </mat-dialog-actions>
</mat-dialog-content>
