<div class="mainDiv" [class.editMode]="singletonModes.editMode()">
    @if(singletonModes.editMode()){
    <app-edit-box [sectionModel]="sectionModel()"></app-edit-box>
    }
    @switch (sectionModel().type) {
    @case("h1"){
    <app-h1-element [sectionModel]="sectionModel()"></app-h1-element>
    }
    @case("h2"){
    <app-h2-element [sectionModel]="sectionModel()"></app-h2-element>
    }
    @case("p"){
    <app-p-element [sectionModel]="sectionModel()"></app-p-element>
    }
    @case("img"){
    <app-img-element [sectionModel]="sectionModel()"></app-img-element>
    }
    @case("code"){
    <app-code-element [sectionModel]="sectionModel()"></app-code-element>
    }
    @case("file"){
    <app-file-element [sectionModel]="sectionModel()"></app-file-element>
    }
    @case("link"){
    <app-link-element [sectionModel]="sectionModel()"></app-link-element>
    }
    }
</div>
