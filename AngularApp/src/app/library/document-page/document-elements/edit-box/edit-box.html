<div>
    <button matButton="elevated" class="noPaddingBtn" (click)="openDialog()">
        <mat-icon>edit</mat-icon>
    </button>
    <button matButton="elevated" class="noPaddingBtn" (click)="decreaseOrder()">
        <mat-icon>arrow_warm_up</mat-icon>
    </button>
    <button matButton="elevated" class="noPaddingBtn" (click)="increaseOrder()">
        <mat-icon>arrow_cool_down</mat-icon>
    </button>
    <span style="font-size: 12px;"
        [style]="editResponse()?.status === 'fail'?'color:var(--mat-sys-error)':'color:var(--mat-sys-primary)'">
        {{editResponse()?.message}}
    </span>

    @if(displaySubmitSpinner()){
    <div id="submit-spinner-layout">
        <mat-spinner id="submit-spinner"></mat-spinner>
    </div>
    }
</div>
