<mat-sidenav-container>

    <mat-sidenav id="" mode="side" opened position="start" fixedInViewport fixedTopGap="56" fixedBottomGap="16">

    </mat-sidenav>

    <mat-sidenav-content>
        <ng-content />
        @for(documentCardModel of documentCardModels(); track documentCardModel.guid){
        <app-document-card [documentCardModel]="documentCardModel"></app-document-card>
        }
    </mat-sidenav-content>

</mat-sidenav-container>
