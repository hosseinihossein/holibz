<div class="top-box clearfix">
    <div class="icon-box" matBadge="5" matTooltip="number of libraries">
        <mat-icon>account_balance</mat-icon>
    </div>
    <div class="icon-box" matBadge="30" matTooltip="number of shelves">
        <mat-icon>shelves</mat-icon>
    </div>
    <div class="icon-box" matBadge="285" matTooltip="number of documents">
        <mat-icon>newsstand</mat-icon>
    </div>

    <button matButton="elevated">
        <mat-icon>account_balance</mat-icon>
        Add a new Library
    </button>
</div>

<div class="list">
    @for(libModel of libraryCards(); track libModel.Guid){
    <app-library-card [model]="libModel"></app-library-card>
    }
</div>
