<mat-sidenav-container>
    <mat-sidenav id="" mode="side" position="start" fixedInViewport fixedTopGap="56" fixedBottomGap="16">

    </mat-sidenav>

    <mat-sidenav-content>
        <ng-content select="mat-card" />

        <div class="top-box clearfix">
            <!-- other buttons -->
            <ng-content />

            @if(isMyLibraries()){
            <a matButton="elevated" [routerLink]="['/library','new']" class="topBtn">
                <mat-icon>account_balance</mat-icon>
                Add a new Library
            </a>
            }
        </div>

        <div class="list">
            @for(libModel of libraryModels(); track libModel.guid){
            <app-library-card [libraryModel]="libModel"></app-library-card>
            }
        </div>
    </mat-sidenav-content>

</mat-sidenav-container>
