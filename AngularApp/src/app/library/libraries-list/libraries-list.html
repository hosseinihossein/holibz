<div class="top-box clearfix">
    <!-- [matBadge]="userModel()?.username" matBadgePosition="below" -->
    <div class="icon-box" [matTooltip]="userModel()?.username">
        @if(userImgSrc()){
        <img [ngSrc]="userImgSrc()!" priority width="56" height="56" alt="user image" id="user-profile-img">
        }
        @else {
        <mat-icon>account_circle</mat-icon>
        }
    </div>
    <div class="icon-box" [matBadge]="libraryModels().length" matTooltip="number of libraries">
        <mat-icon>account_balance</mat-icon>
    </div>
    <div class="icon-box" [matBadge]="totalNumberOfUserShelves()" matTooltip="number of shelves">
        <mat-icon>shelves</mat-icon>
    </div>
    <div class="icon-box" [matBadge]="totalNumberOfUserDocuments()" matTooltip="number of documents">
        <mat-icon>newsstand</mat-icon>
    </div>

    @if(isMyLibraries()){
    <button matButton="elevated">
        <mat-icon>account_balance</mat-icon>
        Add a new Library
    </button>
    }
</div>

<div class="list">
    @for(libModel of libraryModels(); track libModel.guid){
    <app-library-card [libraryModel]="libModel"></app-library-card>
    }
</div>
