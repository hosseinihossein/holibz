<mat-card appearance="outlined">
    <mat-card-header>
        @if(libraryCardModel().hasImage){
        <img [ngSrc]="`/api/Library/LogoImage?guid=${libraryCardModel()!.guid}`" alt="library logo" matCardAvatar>
        }
        @else {
        <mat-icon matCardAvatar style="font-size: 36px;text-align: center;/*width: 40px;height: 40px;*/">
            account_balance
        </mat-icon>
        }
        <mat-card-title>{{libraryCardModel().title}}</mat-card-title>
        <mat-card-subtitle>{{libraryCardModel().ownerUsername}}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
        <p style="font-size: 12px;">{{libraryCardModel().description}}</p>
        <h4 style="margin: 8px 0;">Shelves:</h4>
        <ul style="margin: 0;padding-left: 16px;">
            @for(shelfTitle of libraryCardModel().shelvesTitles; track shelfTitle){
            <li>{{shelfTitle}}</li>
            }
        </ul>
    </mat-card-content>
</mat-card>
