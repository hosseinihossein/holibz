<mat-card appearance="outlined">
    <mat-card-header>
        @if(libraryImageAddress()){
        <img [ngSrc]="libraryImageAddress()!" width="40" height="40" alt="library logo" matCardAvatar>
        }
        @else {
        <mat-icon matCardAvatar style="font-size: 36px;text-align: center;/*width: 40px;height: 40px;*/">
            account_balance
        </mat-icon>
        }
        <mat-card-title>{{libraryModel().title}}</mat-card-title>
        <mat-card-subtitle>{{ownerModel()?.username}}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
        <p style="font-size: 12px;">{{libraryModel().description}}</p>
        <h4 style="margin: 8px 0;">Shelves:</h4>
        <ul style="margin: 0;padding-left: 16px;">
            @for(shelfTitle of libraryModel().shelvesTitles; track shelfTitle){
            <li>{{shelfTitle}}</li>
            }
        </ul>
    </mat-card-content>
</mat-card>
