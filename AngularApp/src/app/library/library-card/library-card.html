<mat-card appearance="outlined">
    <mat-card-header>
        @if(model()?.HasImage){
        <img [ngSrc]="`/api/Library/LogoImage?guid=${model()!.Guid}`" alt="library logo" matCardAvatar>
        }
        @else {
        <mat-icon matCardAvatar style="font-size: 36px;text-align: center;/*width: 40px;height: 40px;*/">
            account_balance
        </mat-icon>
        }
        <mat-card-title>{{model()?.Title}}</mat-card-title>
        <mat-card-subtitle>{{model()?.OwnerUsername}}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
        <ul>
            <h3>Shelves:</h3>
            @for(shelfTitle of model()?.ShelvesTitles; track shelfTitle){
            <li>{{shelfTitle}}</li>
            }
        </ul>
    </mat-card-content>
</mat-card>
