<app-generic-list listType="Shelf" [parentGuid]="libraryGuid()!">
    <mat-card appearance="raised">
        <mat-card-header>
            @if(introductionImage()){
            <img [ngSrc]="introductionImage()!" width="40" height="40" alt="library logo" matCardAvatar>
            }
            @else {
            <mat-icon matCardAvatar
                style="font-size: 36px;text-align: center;/*width: 40px;height: 40px;*/">account_balance</mat-icon>
            }
            <mat-card-title>{{libraryModel()?.title}}</mat-card-title>
            <mat-card-subtitle>{{ownerModel()?.username}}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
            <p>{{libraryModel()?.description}}</p>
        </mat-card-content>

        <mat-card-actions align="end">
            @if(isMyLibrary()){
            <a matButton="elevated" [routerLink]="['/shelf','new', libraryGuid()]">
                <mat-icon>shelves</mat-icon>
                Add a new Shelf
            </a>
            }
        </mat-card-actions>
        @if(isMyLibrary() && !libraryModel()?.isDefault){
        <button matIconButton [matMenuTriggerFor]="settingMenu" aria-label="library setting menu" id="setting-btn">
            <mat-icon>settings</mat-icon>
        </button>
        <mat-menu #settingMenu="matMenu">
            <button mat-menu-item (click)="editIntroduction()">
                <mat-icon>edit</mat-icon>
                Edit Introduction
            </button>
            <button mat-menu-item (click)="deleteLibrary()">
                <mat-icon style="color: var(--mat-sys-error);">delete</mat-icon>
                Delete Library
            </button>
        </mat-menu>
        }
    </mat-card>
    @if(displayWaitSpinner()){
    <app-wait-spinner></app-wait-spinner>
    }
</app-generic-list>
