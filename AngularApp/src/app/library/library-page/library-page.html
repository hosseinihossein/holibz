<app-shelves-list [libraryGuid]="libraryGuid()!">
    <mat-card appearance="raised">
        <mat-card-header>
            @if(libraryModel()?.hasImage){
            <img [ngSrc]="introductionImage()" width="40" height="40" alt="library logo" matCardAvatar>
            }
            @else {
            <mat-icon matCardAvatar
                style="font-size: 36px;text-align: center;/*width: 40px;height: 40px;*/">account_balance</mat-icon>
            }
            <mat-card-title>{{libraryModel()?.title}}</mat-card-title>
            <mat-card-subtitle>{{userModel()?.username}}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
            <p>{{libraryModel()?.description}}</p>
        </mat-card-content>

        <mat-card-actions align="end">
            @if(isMyLibrary()){
            @if(libraryGuid() !== "DefaultLibrary"){
            <button matIconButton class="noPaddingBtn warning" matTooltip="Delete Library" (click)="deleteLibrary()">
                <mat-icon style="color: var(--mat-sys-error);">delete</mat-icon>
            </button>
            <button matIconButton class="noPaddingBtn" matTooltip="Edit Introduction" (click)="editIntroduction()">
                <mat-icon>edit_note</mat-icon>
            </button>
            }
            <a matButton="elevated" [routerLink]="['/shelf','new', libraryGuid()]">
                <mat-icon>shelves</mat-icon>
                Add a new Shelf
            </a>
            }
        </mat-card-actions>
    </mat-card>
    @if(displaySubmitSpinner()){
    <div id="submit-spinner-layout">
        <mat-spinner id="submit-spinner"></mat-spinner>
    </div>
    }
</app-shelves-list>
