<mat-expansion-panel hideToggle expanded>
    <mat-expansion-panel-header>
        <mat-panel-title>
            <mat-icon [matBadge]="shelfModel().totalNumberOfShelfDocuments" matBadgePosition="above">shelves</mat-icon>
            &nbsp;
            &nbsp;
            {{shelfModel().title}}
        </mat-panel-title>
        <mat-panel-description>
            {{shelfModel().description}}
        </mat-panel-description>

        @if(userImgSrc()){
        <img id="owner-username" [ngSrc]="userImgSrc()!" priority width="50" height="50" alt="user image"
            [matTooltip]="userModel()?.username">
        }
        @else {
        <mat-icon style="font-size: 50px;width: 50px;height: 50px;"
            [matTooltip]="userModel()?.username">account_circle</mat-icon>
        }
    </mat-expansion-panel-header>

    <div class="listOfDocs">
        @for (documentCardModel of shelfModel().documentCardModels; track documentCardModel) {
        <app-document-card [documentCardModel]="documentCardModel" [mini]="true"></app-document-card>
        }
    </div>

    <mat-action-row>
        <button matButton (click)="openShelf()">Open Shelf</button>
    </mat-action-row>
</mat-expansion-panel>
