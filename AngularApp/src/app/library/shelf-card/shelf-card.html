<mat-expansion-panel hideToggle expanded>
    <mat-expansion-panel-header>
        <mat-panel-title>
            <div class="icon-box" [matBadge]="shelfModel()?.totalNumberOfShelfDocuments" matBadgePosition="above">
                @if(shelfImageAddress()){
                <img [ngSrc]="shelfImageAddress()!" width="40" height="40" alt="shelf image">
                }
                @else {
                <mat-icon>shelves</mat-icon>
                }
            </div>
            &nbsp;
            &nbsp;
            {{shelfModel()?.title}}
        </mat-panel-title>
        <mat-panel-description>
            {{shelfModel()?.description}}
        </mat-panel-description>

        @if(ownerImgSrc()){
        <img id="owner-username" [ngSrc]="ownerImgSrc()!" priority width="50" height="50" alt="user image"
            [matTooltip]="ownerModel()?.username">
        }
        @else {
        <mat-icon style="font-size: 50px;width: 50px;height: 50px;"
            [matTooltip]="ownerModel()?.username">account_circle</mat-icon>
        }
    </mat-expansion-panel-header>

    <div class="listOfDocs">
        @for (docGuid of this.shelfModel()?.documentsGuids; track docGuid) {
        <app-document-card [documentGuid]="docGuid" [mini]="true" (click)="router.navigate(['/document',docGuid])"
            style="cursor: pointer;"></app-document-card>
        }
    </div>

    <mat-action-row>
        <button matButton (click)="openShelf()">Open Shelf</button>
    </mat-action-row>

</mat-expansion-panel>
