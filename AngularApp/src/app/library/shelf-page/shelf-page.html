<app-generic-list listType="Document" [itemGuids]="genericListItemGuids()" [tags]="genericListTags()"
    (removeDocumentFromParentShelf)="removeDocumentFromThisShelf($event);" [filterInfo]="filterInfo()"
    (submitFilter)="onSubmitFilter($event)">
    <mat-card appearance="raised">
        <mat-card-header>
            <div matCardAvatar [matBadge]="shelfModel()?.totalNumberOfShelfDocuments" matBadgePosition="above">
                @if(introductionImage()){
                <img [ngSrc]="introductionImage()!" width="40" height="40" alt="shelf image">
                }
                @else{
                <mat-icon id="shelf-logo">shelves</mat-icon>
                }
            </div>
            <mat-card-title>
                {{shelfModel()?.title}}
                <!--span style="font-size: 14px;">
                    in
                    <a [routerLink]="['/library',shelfModel()?.library?.guid]">
                        {{shelfModel()?.library?.title}}
                    </a>
                    library
                </span-->
            </mat-card-title>
            <mat-card-subtitle>
                <a [routerLink]="['/profile',ownerModel()?.guid]">
                    {{ownerModel()?.username}}
                </a>
            </mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
            <p>
                {{shelfModel()?.description}}
            </p>
        </mat-card-content>

        <mat-card-actions align="end">
            @if(isMyShelf()){
            <a matButton="elevated" [routerLink]="['/document','new',shelfGuid()]">
                <mat-icon>newsstand</mat-icon>
                Add a new Document
            </a>
            }
            @if(identityService.isAuthenticated()){
            <button matIconButton (click)="toggleFavorite()"
                [matTooltip]="isMyFavorite() ? 'Unmark from favorites' : 'Mark as favorite'">
                <mat-icon [style]="isMyFavorite() ? iconService.fillIcon() : ''">
                    bookmark
                </mat-icon>
            </button>
            }
        </mat-card-actions>
        @if(isMyShelf() && !shelfModel()?.isDefault){
        <button matIconButton [matMenuTriggerFor]="settingMenu" aria-label="library setting menu" id="setting-btn">
            <mat-icon>settings</mat-icon>
        </button>
        <mat-menu #settingMenu="matMenu">
            <button mat-menu-item (click)="editIntroduction()">
                <mat-icon>edit</mat-icon>
                Edit Introduction
            </button>
            <button mat-menu-item (click)="editParentLibraries()">
                <mat-icon>account_tree</mat-icon>
                Change Parent Libraries
            </button>
            <button mat-menu-item (click)="deleteShelf()">
                <mat-icon style="color: var(--mat-sys-error);">delete</mat-icon>
                Delete Shelf
            </button>
            <button mat-menu-item (click)="displayUsersInFavor()">
                <mat-icon>group_diersity</mat-icon>
                Users In Favor
            </button>
        </mat-menu>
        }
    </mat-card>

    <mat-paginator [length]="totalNumberOfDocuments()" [pageSize]="pageSize()" [pageSizeOptions]="[10, 20, 50, 100]"
        (page)="handlePageEvent($event)" aria-label="Select page" style="width: fit-content;margin: 50px auto;">
    </mat-paginator>

</app-generic-list>

@if(displayWaitSpinner()){
<app-wait-spinner></app-wait-spinner>
}
