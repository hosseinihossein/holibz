<app-documents-list [shelfGuid]="shelfGuid()!" [ownerGuid]="shelfModel()?.ownerGuid ?? ''">
    <mat-card appearance="raised">
        <mat-card-header>
            <div matCardAvatar [matBadge]="shelfModel()?.totalNumberOfShelfDocuments" matBadgePosition="above">
                @if(introductionImage()){
                <img [ngSrc]="introductionImage()!" width="40" height="40" alt="shelf image">
                }
                @else{
                <mat-icon id="shelf-logo">shelves</mat-icon>
                }
            </div>
            <mat-card-title>
                {{shelfModel()?.title}}
                <!--span style="font-size: 14px;">
                    in
                    <a [routerLink]="['/library',shelfModel()?.library?.guid]">
                        {{shelfModel()?.library?.title}}
                    </a>
                    library
                </span-->
            </mat-card-title>
            <mat-card-subtitle>
                <a [routerLink]="['/profile',ownerModel()?.guid]">
                    {{ownerModel()?.username}}
                </a>
            </mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
            <p>
                {{shelfModel()?.description}}
            </p>
        </mat-card-content>

        <mat-card-actions align="end">
            @if(isMyShelf()){
            <a matButton="elevated" [routerLink]="['/document','new',shelfGuid()]">
                <mat-icon>newsstand</mat-icon>
                Add a new Document
            </a>
            }
        </mat-card-actions>
        @if(isMyShelf() && !shelfModel()?.isDefault){
        <button matIconButton [matMenuTriggerFor]="settingMenu" aria-label="library setting menu" id="setting-btn">
            <mat-icon>settings</mat-icon>
        </button>
        <mat-menu #settingMenu="matMenu">
            <button mat-menu-item (click)="editIntroduction()">
                <mat-icon>edit</mat-icon>
                Edit Introduction
            </button>
            <button mat-menu-item (click)="editParentLibraries()">
                <mat-icon>account_tree</mat-icon>
                Change Parent Libraries
            </button>
            <button mat-menu-item (click)="deleteShelf()">
                <mat-icon style="color: var(--mat-sys-error);">delete</mat-icon>
                Delete Shelf
            </button>
        </mat-menu>
        }
    </mat-card>
    @if(displaySubmitSpinner()){
    <div id="submit-spinner-layout">
        <mat-spinner id="submit-spinner"></mat-spinner>
    </div>
    }
</app-documents-list>
