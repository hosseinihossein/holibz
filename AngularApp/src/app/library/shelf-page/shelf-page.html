<app-documents-list [shelfGuid]="shelfGuid()!">
    <mat-card appearance="raised">
        <mat-card-header>
            <div matCardAvatar [matBadge]="shelfModel()?.totalNumberOfShelfDocuments" matBadgePosition="above">
                @if(shelfModel()?.hasImage){
                <img [ngSrc]="introductionImage()" width="40" height="40" alt="shelf image">
                }
                @else{
                <mat-icon id="shelf-logo">shelves</mat-icon>
                }
            </div>
            <mat-card-title>
                {{shelfModel()?.title}}
                <!--span style="font-size: 14px;">
                    in
                    <a [routerLink]="['/library',shelfModel()?.library?.guid]">
                        {{shelfModel()?.library?.title}}
                    </a>
                    library
                </span-->
            </mat-card-title>
            <mat-card-subtitle>
                <a [routerLink]="['/profile',userModel()?.guid]">
                    {{userModel()?.username}}
                </a>
            </mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
            <p>
                {{shelfModel()?.description}}
            </p>
        </mat-card-content>

        <mat-card-actions align="end">
            @if(isMyShelf()){
            @if(shelfGuid() !== "DefaultShelf"){
            <button matIconButton class="noPaddingBtn" matTooltip="Delete Shelf" (click)="deleteShelf()">
                <mat-icon style="color: var(--mat-sys-error);">delete</mat-icon>
            </button>
            <button matIconButton class="noPaddingBtn" matTooltip="Edit Parent Libraries"
                (click)="editParentLibraries()">
                <mat-icon>account_tree</mat-icon>
            </button>
            <button matIconButton class="noPaddingBtn" matTooltip="Edit Introduction" (click)="editIntroduction()">
                <mat-icon>edit_note</mat-icon>
            </button>
            }
            <a matButton="elevated" [routerLink]="['/document','new',shelfGuid()]">
                <mat-icon>newsstand</mat-icon>
                Add a new Document
            </a>
            }
        </mat-card-actions>
    </mat-card>
    @if(displaySubmitSpinner()){
    <div id="submit-spinner-layout">
        <mat-spinner id="submit-spinner"></mat-spinner>
    </div>
    }
</app-documents-list>
