<app-documents-list [shelfGuid]="shelfModel()?.guid!">
    <mat-card appearance="raised">
        <mat-card-header>
            <div matCardAvatar [matBadge]="shelfModel()?.totalNumberOfShelfDocuments" matBadgePosition="above">
                @if(shelfModel()?.hasImage){
                <img [ngSrc]="`/api/Library/ShelfImage?shelfGuid=${shelfModel()!.guid}`" width="40" height="40"
                    alt="shelf image">
                }
                @else{
                <mat-icon id="shelf-logo">shelves</mat-icon>
                }
            </div>
            <mat-card-title>
                {{shelfModel()?.title}}
                <span style="font-size: 14px;">
                    in
                    <a [routerLink]="['/library',shelfModel()?.library?.guid]">
                        {{shelfModel()?.library?.title}}
                    </a>
                    library
                </span>
                @if(signletonModes.editMode()){
                <button matIconButton class="noPaddingBtn" matTooltip="Edit title" (click)="openEditTitleDialog()">
                    <mat-icon>edit</mat-icon>
                </button>
                }
            </mat-card-title>
            <mat-card-subtitle>
                <a [routerLink]="['/profile',userModel()?.guid]">
                    {{userModel()?.username}}
                </a>
            </mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
            <p>
                {{shelfModel()?.description}}
            </p>
            @if(signletonModes.editMode()){
            <button matIconButton class="noPaddingBtn" matTooltip="Edit description"
                (click)="openEditDescriptionDialog()">
                <mat-icon>edit</mat-icon>
            </button>
            }
        </mat-card-content>
        <mat-card-actions align="end">
            @if(isMyShelf()){
            <button matButton="elevated" class="noPaddingBtn" id="edit-mode-btn"
                (click)="signletonModes.toggleEditMode()" matTooltip="Edit">
                <mat-icon>{{signletonModes.editMode() ? 'edit_off' : 'edit'}}</mat-icon>
            </button>
            <a matButton="elevated" [routerLink]="['/document','new',shelfModel()?.guid]">
                <mat-icon>newsstand</mat-icon>
                Add a new Document
            </a>
            }
        </mat-card-actions>
    </mat-card>
</app-documents-list>
