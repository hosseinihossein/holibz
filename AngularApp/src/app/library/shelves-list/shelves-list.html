<mat-sidenav-container>

    <mat-sidenav id="" mode="side" position="start" fixedInViewport fixedTopGap="56" fixedBottomGap="16">

    </mat-sidenav>

    <mat-sidenav-content>
        <ng-content select="mat-card" />

        <mat-accordion multi>
            @for(shelfModel of shelfModels(); track shelfModel.guid){
            <app-shelf-card [shelfModel]="shelfModel"></app-shelf-card>
            }
        </mat-accordion>
    </mat-sidenav-content>

</mat-sidenav-container>
