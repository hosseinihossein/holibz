<mat-toolbar [class.shadow]="displayShadow()">
    <a matIconButton routerLink="" style="overflow: hidden;width: 50px;height: 50px;padding: 0;margin: 0;">
        <img [src]="singletonModes.darkMode() ? 'HLlogo-DarkMode.png' : 'HLlogo-LightMode.png'" alt="HLlogo"
            style="width:50px;height:50px;margin: 0;padding: 0;">
    </a>

    <mat-action-list id="mainMenu">
        <app-dropdown-button [menu]="libraries">Libraries</app-dropdown-button>
        <app-dropdown-button [menu]="solutions">Solutions</app-dropdown-button>
        <a matButton routerLink="">Contact Us</a>
    </mat-action-list>
    <mat-action-list id="littleMenu">
        <button matButton [matMenuTriggerFor]="littleMenu" class="noPaddingBtn">
            <mat-icon>menu</mat-icon>
        </button>
    </mat-action-list>

    <span class="full-spacer"></span>

    @if(singletonModes.darkMode()) {
    <button matIconButton class="lightDarkBtn" matTooltip="Light Mode" (click)="singletonModes.toggleDarkMode()">
        <mat-icon>light_mode</mat-icon>
    </button>
    }
    @else {
    <button matIconButton class="lightDarkBtn" matTooltip="Dark Mode" (click)="singletonModes.toggleDarkMode()">
        <mat-icon>dark_mode</mat-icon>
    </button>
    }
    <app-account-dropdown [menu]="account"></app-account-dropdown>

    <!--------------- mat-menu -------------->
    <mat-menu #littleMenu class="navbar-matMenu">
        <button mat-menu-item [matMenuTriggerFor]="libraries">Libraries</button>
        <button mat-menu-item [matMenuTriggerFor]="solutions">Solutions</button>
        <a matButton routerLink="">Contact Us</a>
    </mat-menu>

    <mat-menu #libraries class="navbar-matMenu">
        <button mat-menu-item [matMenuTriggerFor]="backend">Backend</button>
        <button mat-menu-item [matMenuTriggerFor]="frontend">Frontend</button>
    </mat-menu>
    <mat-menu #backend class="navbar-matMenu">
        <a mat-menu-item>NodeJs</a>
        <a mat-menu-item>Asp.Net Core</a>
        <a mat-menu-item>etc.</a>
    </mat-menu>
    <mat-menu #frontend class="navbar-matMenu">
        <a mat-menu-item>Html Css Js</a>
        <a mat-menu-item>Angular</a>
        <a mat-menu-item>React</a>
    </mat-menu>

    <mat-menu #solutions class="navbar-matMenu">
        <button mat-menu-item [matMenuTriggerFor]="comunication">Comunication</button>
        <a mat-menu-item>Realtime</a>
        <a mat-menu-item>Messaging</a>
    </mat-menu>
    <mat-menu #comunication class="navbar-matMenu">
        <a mat-menu-item>Chat</a>
        <a mat-menu-item>Video Call</a>
        <a mat-menu-item>Streaming</a>
    </mat-menu>

    <mat-menu #account class="navbar-matMenu">
        <a mat-menu-item>
            <mat-icon>login</mat-icon>
            Login
        </a>
        <a mat-menu-item>
            <mat-icon>article_person</mat-icon>
            Profile
        </a>
        <a mat-menu-item>
            <mat-icon>logout</mat-icon>
            Logout
        </a>
    </mat-menu>

</mat-toolbar>
