<div>
    <button matButton (click)="deleteAllNotifs()" style="color: var(--mat-sys-error);margin: 4px 8px;">
        <mat-icon>ink_eraser</mat-icon>
        Erase All Notifications
    </button>
</div>

@for(notif of notifications(); track notif.guid){
<mat-card>
    <mat-card-header>
        <mat-card-title>{{notif.title}}</mat-card-title>
        <mat-card-subtitle>{{notif.createdAt | date}}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
        @for(des of notif.description; track des){
        <p>{{des}}</p>
        }
    </mat-card-content>

    <mat-card-actions align="end">
        <button matButton (click)="deleteNotif(notif.guid)" style="color: var(--mat-sys-error);">
            Dismiss
        </button>
        @if(notif.link){
        <button matButton (click)="openNotif(notif.link)">Open</button>
        }
    </mat-card-actions>
</mat-card>
}

<mat-paginator [length]="totalNumberOfNotifs()" [pageSizeOptions]="[10, 20, 50, 100]" [pageIndex]="0"
    (page)="handlePageEvent($event)" aria-label="Select page of notification results">
</mat-paginator>

@if(displaySubmitSpinner()){
<div id="submit-spinner-layout">
    <mat-spinner id="submit-spinner"></mat-spinner>
</div>
}
