<mat-card>
    <mat-card-header>
        <a [routerLink]="['/profile', writerModel()?.guid]" mat-card-avatar>
            @if(userAvatarSrc()){
            <img [ngSrc]="userAvatarSrc()!" priority width="50" height="50" alt="writer image" class="writer-avatar">
            }
            @else {
            <mat-icon style="font-size: 50px;width: 50px;height: 50px;" class="writer-avatar">account_circle</mat-icon>
            }
        </a>
        <mat-card-title>
            <a [routerLink]="['/profile', writerModel()?.guid]">
                {{writerModel()?.username ?? "hossein"}}
            </a>
        </mat-card-title>
        @if(commentModel().isReply){
        <mat-card-subtitle>
            <span id="replyTo-span" (click)="goToElement(commentModel().replyToGuid)">
                {{commentModel().replyToBrief}}
            </span>
        </mat-card-subtitle>
        }
    </mat-card-header>

    <mat-card-content>
        <p>{{commentModel().text}}</p>
    </mat-card-content>

    <mat-card-actions align="end">
        <button matIconButton>
            <mat-icon [style]="commentModel().amIThumbsUp ? iconService.fillIcon() :''">
                thumb_up
            </mat-icon>
        </button>
        <button matIconButton>
            <mat-icon [style]="commentModel().amIThumbsDown ? iconService.fillIcon() :''">
                thumb_down
            </mat-icon>
        </button>
        <button>
            <mat-icon>
                reply
            </mat-icon>
        </button>
    </mat-card-actions>
</mat-card>
