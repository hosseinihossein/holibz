<div id="main-div">
    <div id="top-div">
        <div style="position: relative;margin: 0 8px;">
            <button matMiniFab aria-label="like button" id="like-btn" (click)="toggleLike()" matTooltip="Like"
                matTooltipPosition="above">
                <!-- does this work after updating to v21 and migrating to zoneless app? -->
                <!-- if Not then define an if to check the identityService.isAuthenticated() -->
                <mat-icon [style]="iLiked() ? iconService.fillIcon()+'color:red;' : ''">
                    favorite
                </mat-icon>
            </button>
            <span id="numberOfLikes-span" (click)="openListOfLikes()" matTooltip="Like list" matTooltipPosition="above">
                {{reviewModel().numberOfLikes}}
            </span>
        </div>

        <button matMiniFab aria-label="add comment button" id="comment-btn" matTooltip="Write a comment"
            matTooltipPosition="above" (click)="onNewComment()">
            <mat-icon>add_comment</mat-icon>
        </button>

        <span class="full-spacer"></span>

        <mat-button-toggle-group aria-label="order comments by" (change)="orderComments($event)"
            matTooltip="Order comments by" matTooltipPosition="above">
            <mat-button-toggle value="Newest">Newest</mat-button-toggle>
            <mat-button-toggle value="Oldest">Oldest</mat-button-toggle>
            <mat-button-toggle value="Most Agreed">Most Agreed</mat-button-toggle>
        </mat-button-toggle-group>
    </div>

    <div class="clearfix" style="width: 100%;position: relative;">
        @for(commentGuid of reviewModel().commentsGuids; track commentGuid){
        <app-review-comment [commentGuid]="commentGuid" (submitReply)="onSubmitReply(commentGuid,$event)"
            (displayReplies)="onDisplayReplies(commentGuid)" (deleteComment)="onDeleteComment(commentGuid)"
            (parentComment)="requestedCommentGuid.set($event)" [deletedCommentsGuids]="deletedCommentsGuids()">
        </app-review-comment>
        }


        @if(displayWaitSpinner()){
        <app-wait-spinner></app-wait-spinner>
        }
    </div>

    @if(reviewModel() && reviewModel()!.totalNumberOfComments > 10){
    <mat-paginator [length]="reviewModel().totalNumberOfComments" [pageSize]="10" [pageSizeOptions]="[10, 20, 50, 100]"
        (page)="handlePageEvent()" style="margin: 16px 0;" aria-label="Select page of comments">
    </mat-paginator>
    }

</div>
