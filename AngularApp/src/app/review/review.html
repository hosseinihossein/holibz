<div id="main-div">
    <div id="top-div">
        <div style="position: relative;margin: 0 8px;">
            <button matMiniFab aria-label="like button" id="like-btn" (click)="toggleLike()" matTooltip="Like"
                matTooltipPosition="above">
                <mat-icon [style]="reviewModel()?.isLiked ? iconService.fillIcon()+'color:red;' : ''">
                    favorite
                </mat-icon>
            </button>
            <span id="numberOfLikes-span" (click)="openListOfLikes()" matTooltip="Like list" matTooltipPosition="above">
                {{reviewModel()?.numberOfLikes}}
            </span>
        </div>

        <button matMiniFab aria-label="add comment button" id="comment-btn" matTooltip="Write a comment"
            matTooltipPosition="above">
            <mat-icon>add_comment</mat-icon>
        </button>

        <span class="full-spacer"></span>

        <mat-button-toggle-group [formControl]="sortCommentsBy_FormControl" aria-label="sort comments by"
            (change)="sortComments()" matTooltip="Sort comments by" matTooltipPosition="below">
            <mat-button-toggle value="Newest">Newest</mat-button-toggle>
            <mat-button-toggle value="Oldest">Oldest</mat-button-toggle>
            <mat-button-toggle value="Most Agreed">Most Agreed</mat-button-toggle>
        </mat-button-toggle-group>
    </div>

    <div class="clearfix" style="width: 100%;position: relative;">
        <app-review-comment></app-review-comment>
        <app-review-comment></app-review-comment>

        @if(displaySubmitSpinner()){
        <div id="submit-spinner-layout">
            <mat-spinner id="submit-spinner"></mat-spinner>
        </div>
        }
    </div>

    <button matButton style="margin: 8px auto;font-size: 12px;width: fit-content;display: flex;"
        (click)="showMoreComments()">
        Show more..
    </button>

</div>
