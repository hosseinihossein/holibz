<mat-sidenav-container>

    <mat-sidenav id="" mode="side" opened position="start" fixedInViewport fixedTopGap="56" fixedBottomGap="16">
        <p style="font-weight: 500;color: var(--mat-sys-on-surface);padding-left: 16px;">
            Sections:
        </p>
        <div class="sidenav-option-container">
            <a matFab extended [routerLink]="['/profile',identityService.userModel()?.guid]">
                <mat-icon>article_person</mat-icon>
                Profile
            </a>
        </div>
        <div class="sidenav-option-container">
            <a matFab extended [routerLink]="['UserAccountManager']">
                <mat-icon>settings_account_box</mat-icon>
                User Account Manager
            </a>
        </div>
        <div class="sidenav-option-container">
            <a matFab extended [routerLink]="['Notification']">
                <mat-icon>edit_notifications</mat-icon>
                Notifications
            </a>
        </div>
        @if(identityService.userModel()?.roles?.includes("Identity_Admins")){
        <div class="sidenav-option-container">
            <a matFab extended [routerLink]="['/UsersList']">
                <mat-icon>patient_list</mat-icon>
                Users List
            </a>
        </div>
        }
        @if(identityService.userModel()?.roles?.includes("Backup_Admins")){
        <div class="sidenav-option-container">
            <a matFab extended [routerLink]="['/BackupAdmin']">
                <mat-icon>cloud_sync</mat-icon>
                Backup
            </a>
        </div>
        }
    </mat-sidenav>

    <mat-sidenav-content>
        <router-outlet />
    </mat-sidenav-content>

</mat-sidenav-container>
