<app-libraries-list>
    <mat-card appearance="outlined">
        <mat-card-header>
            <div style="float: left;position: relative;">
                @if(userImgSrc()){
                <img [ngSrc]="userImgSrc()!" priority width="100" height="100" alt="user image" id="user-profile-img">
                }
                @else {
                <mat-icon style="font-size: 100px;width: 100px;height: 100px;">account_circle</mat-icon>
                }
            </div>

            <div style="float: left;position: relative;">
                <mat-card-title>
                    {{username()}}
                </mat-card-title>

                @if(email() && displayEmailPublicly()){
                <mat-card-subtitle>
                    {{email()}}
                </mat-card-subtitle>
                }
            </div>

        </mat-card-header>

        <mat-card-content>
            <p>
                @if(description()){
                {{description()}}
                }
                @else{
                About me..
                }
            </p>
        </mat-card-content>
        @if(isMyProfile()){
        <a matIconButton aria-label="user account manager link" [routerLink]="['/dashboard','UserAccountManager']"
            id="userAccountManager-link">
            <mat-icon>edit</mat-icon>
        </a>
        }
    </mat-card>
</app-libraries-list>
